version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it_announcement_laravel_web
    restart: unless-stopped
    ports:
      - "${PORT:-5897}:5897"
    volumes:
      - ./storage/app:/app/storage/app
      - ./.env:/app/.env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://annouce.thonglorpet.com}
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST:-192.168.98.254}
      - DB_PORT=${DB_PORT:-5434}
      - DB_DATABASE=${DB_DATABASE:-imedx_tlp_for_it}
      - DB_USERNAME=${DB_USERNAME:-eservices}
      - DB_PASSWORD=${DB_PASSWORD:-Tlp@2023}
      - DB_SCHEMA=${DB_SCHEMA:-intra_tl}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5897/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
