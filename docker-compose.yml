version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it_announcement_laravel_web
    restart: unless-stopped
    ports:
      - "${PORT:-5897}:5897"
    volumes:
      - app_storage_public:/app/storage/app/public
      - app_logs:/app/storage/logs
    environment:
      - APP_NAME=IT_Announcement
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:-base64:7K5gB0qJ72n0O22R1j0PjS6cR7mi04s3D76u4234xY0=}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-https://annouce.thonglorpet.com}
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST:-192.168.98.254}
      - DB_PORT=${DB_PORT:-5434}
      - DB_DATABASE=${DB_DATABASE:-imedx_tlp_for_it}
      - DB_USERNAME=${DB_USERNAME:-eservices}
      - DB_PASSWORD=${DB_PASSWORD:-Tlp@2023}
      - DB_SCHEMA=${DB_SCHEMA:-intra_tl}
      - DB_AUTO_MIGRATE=${DB_AUTO_MIGRATE:-false}
      - LOG_CHANNEL=daily
      - LOG_LEVEL=${LOG_LEVEL:-warning}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5897/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - app_network

volumes:
  app_storage_public:
    name: it_announcement_storage_public
  app_logs:
    name: it_announcement_logs

networks:
  app_network:
    driver: bridge
